name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · test · benches
    runs-on: ubuntu-latest
    steps:
      - name: Check out typesec
        uses: actions/checkout@v4
        with:
          path: typesec

      # typesec depends on Grust through a local *path* dependency
      # (`../grust/crates/...` in the workspace Cargo.toml). CI must place a
      # Grust checkout as a sibling of the typesec checkout so the path resolves.
      - name: Check out Grust (path dependency)
        uses: actions/checkout@v4
        with:
          repository: querygraph/grust
          path: grust
          # Pin to the Grust ref that provides the API typesec builds against;
          # bump deliberately when the typesec/Grust contract changes. If
          # querygraph/grust is private, also pass a token with read access:
          #   token: ${{ secrets.GRUST_CHECKOUT_TOKEN }}
          # TypeSec 0.13.1 tracks the reviewed Grust 0.12.1 release candidate.
          # Pin the commit so a moving or older `main` cannot silently change
          # this cross-repository build contract.
          ref: a178c30de9b5c194fae68c9bed37c6665e1096ad

      - name: Show toolchain (pinned by rust-toolchain.toml)
        working-directory: typesec
        run: |
          rustup show
          cargo --version

      # `cargo fmt --all` also reformats the Grust path dependency, so the fmt
      # check is scoped to the typesec packages. Keep this list in sync with
      # the workspace `members` in Cargo.toml.
      - name: rustfmt
        working-directory: typesec
        run: >
          cargo fmt --check
          -p typesec-core -p typesec-rbac -p typesec-odrl -p typesec-agent
          -p typesec-integrations -p typesec-macro -p typesec-cli
          -p typesec-memory -p typesec-python -p typesec-wasm -p typesec

      - name: clippy
        working-directory: typesec
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        working-directory: typesec
        run: cargo test --workspace

      # The default `--workspace` test only exercises typesec-memory's default
      # features; run its full feature matrix (graph-memory, receipts, agent,
      # ollama, conformance) so a feature-gated regression can't slip through.
      - name: test typesec-memory (all features)
        working-directory: typesec
        run: cargo test -p typesec-memory --all-features

      # typesec-wasm must keep cross-compiling to wasm32; the host `--workspace`
      # build doesn't prove that. (Uses .cargo/config.toml's getrandom cfg.)
      - name: wasm build
        working-directory: typesec
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p typesec-wasm --target wasm32-unknown-unknown

      # Run every Criterion benchmark once (no measurement) so a broken bench —
      # like the ODRL bench that used to panic on malformed YAML — fails CI
      # instead of rotting silently.
      - name: bench smoke
        working-directory: typesec
        run: cargo bench --workspace -- --test
