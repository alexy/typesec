[package]
name = "typesec-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent executor with typestate and capability-based access control"

[dependencies]
typesec-core = { version = "0.14.0", path = "../typesec-core" }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# rbac/odrl/tokio/futures are exercised only by tests; the library itself is
# engine-agnostic and async-runtime-free (which keeps it wasm-compatible).
typesec-rbac = { version = "0.14.0", path = "../typesec-rbac" }
typesec-odrl = { version = "0.14.0", path = "../typesec-odrl" }
tokio = { workspace = true }
futures = { workspace = true }
typesec-macro = { version = "0.14.0", path = "../typesec-macro" }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
