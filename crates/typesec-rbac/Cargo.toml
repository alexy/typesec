[package]
name = "typesec-rbac"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "RBAC policy engine for typesec — YAML → typed enforcement"

[features]
default = ["graph"]
# The grust-backed GraphPolicyEngine. Disable for targets where the graph
# stack is unavailable (e.g. wasm32).
graph = ["dep:grust-graph", "dep:grust-cypher"]

[dependencies]
typesec-core = { version = "0.12.0", path = "../typesec-core" }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
garde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
glob = { workspace = true }
grust-graph = { workspace = true, optional = true }
grust-cypher = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "rbac_check"
harness = false
