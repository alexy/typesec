[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "typesec"
version = "0.11.0"
description = "Type-level security for AI agents: policy-gated tool calls for OpenAI, Anthropic, LangChain, Pydantic AI, and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "typesec contributors" }]
keywords = ["security", "agents", "capabilities", "rbac", "odrl", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/alexy/typesec"

[tool.maturin]
module-name = "typesec._native"
python-source = "python"
features = ["extension-module"]
