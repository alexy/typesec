[package]
name = "typesec-memory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Marciana: capability-secured, information-flow-typed memory for AI agents"

[features]
default = []
# The Grust-backed bi-temporal knowledge-graph store. Off by default so the
# vault core (and its guarantees) build everywhere, incl. wasm32.
graph-memory = ["dep:grust-graph"]
# Signed, offline-verifiable deletion receipts (ed25519 via
# typesec-integrations). Off by default to keep the core dependency-light.
receipts = ["dep:typesec-integrations"]
# Local-model extraction via Ollama (HTTP client from typesec-integrations,
# so raw episodes never leave the box).
ollama = ["dep:typesec-integrations"]
# The agent surface: guarded memory tool bindings + a router that turns
# authorized memory tool calls into vault operations.
agent = ["dep:typesec-agent"]
# The backend conformance harness + versioned fixture corpus. Backend crates
# (querygraph-memory) enable this in dev-dependencies and run
# `conformance::run_store_conformance` against each store.
conformance = []

[dependencies]
typesec-core = { version = "0.14.0", path = "../typesec-core" }
# Only for the `graph-memory` store; kept optional so the core stays lean and
# wasm-buildable.
grust-graph = { workspace = true, optional = true }
# Only for the `receipts` feature.
typesec-integrations = { version = "0.14.0", path = "../typesec-integrations", optional = true }
# Only for the `agent` feature.
typesec-agent = { version = "0.14.0", path = "../typesec-agent", optional = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
typesec-rbac = { version = "0.14.0", path = "../typesec-rbac" }
typesec-odrl = { version = "0.14.0", path = "../typesec-odrl" }
typesec-integrations = { version = "0.14.0", path = "../typesec-integrations" }
ed25519-dalek = { workspace = true }
chrono = { workspace = true }
trybuild = "1"

[[bench]]
name = "memory_paths"
harness = false

[[bench]]
name = "cognition_paths"
harness = false
