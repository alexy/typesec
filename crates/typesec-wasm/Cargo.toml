[package]
name = "typesec-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for Typesec: policy-gated tool calls for JS/TS agents"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typesec-core = { version = "0.11.0", path = "../typesec-core" }
# No graph engine on wasm: the grust stack is not wasm-ready.
typesec-rbac = { version = "0.11.0", path = "../typesec-rbac", default-features = false }
typesec-odrl = { version = "0.11.0", path = "../typesec-odrl" }
typesec-agent = { version = "0.11.0", path = "../typesec-agent" }
wasm-bindgen = "0.2"
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# ahash (via jsonschema) pulls getrandom 0.3, which needs an explicit JS
# backend on wasm32-unknown-unknown (paired with the rustflags cfg in
# .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
